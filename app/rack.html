   +'<div class="ley"><span><i style="background:#1f4e9c"></i>Racks</span><span><i style="background:#d9f0df"></i>Pasillo</span>'+(D.h!=null?'<span><i style="background:#e8611a"></i>Usted está aquí</span>':'')+'</div></div>'
   +'<div class="card"><div class="tit">🧊 Vista en 3D</div><div id="v3d">'+vista3d(D,0)+'</div><a class="btn sec" style="margin:10px 0 0" href="javascript:__girar3d()">⟳ Girar la vista</a></div>'
   +'<div class="card"><div class="tit">📋 Detalles de la instalación</div>'+fila('Sistema',S.t)+fila(T.pl||'Posiciones',T.pos)+fila('Filas',T.fi)+fila('Módulos (bahías)',T.mo)+fila('Niveles',S.nv+(S.ps?' + piso':''))
   +fila(T.ml||'Marcos',T.ma)+fila(T.vl||'Pares de vigas',T.vi)+fila('Altura de la escalera',fm(S.al)+' m')+fila('Fondo',fm(S.pr)+' m')+fila(S.tp==='cantilever'?'Separación de columnas':'Largo del larguero',fm(S.vg)+' m')
   +fila('Perfil del larguero',S.pe)+fila('Calibre de la escalera',S.cb)+fila('Capacidad por nivel',S.cp?Number(S.cp).toLocaleString('en-US')+' kg':'')+fila('Pasillo de trabajo',fm(S.pa)+' m')+fila('Área',fm(T.ar,0)+' m²')+(D.h!=null&&D.F[D.h]?fila('Esta etiqueta','Fila F'+(D.h+1)+' · '+D.F[D.h][4]+' módulos'):'')+'</div>'})
 .catch(function(e){var box=document.getElementById('plano');if(box)box.innerHTML='<div class="card" style="font-size:14px;color:#6b7785">El plano de esta instalación no se pudo mostrar en este navegador. Actualiza el navegador o pide el plano a tu asesor.</div>'})})();
</script></body></html>
